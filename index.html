<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PharmaClass 3.0 — Plataforma escolar online</title>
<link rel="stylesheet" href="../css/styles.css"></head>
<body>
<header class="top"><div class="brand"><div class="logo">✚</div>PharmaClass <span class="badge">3.0 · plataforma online</span></div><div class="right"><span id="who" class="muted small">Demonstração</span><button id="exit" class="btn alt hidden" onclick="logout()">Sair</button></div></header>
<div class="layout"><aside id="nav">
<button class="nav active" data-page="home">⌂ Início</button>
<button class="nav" data-page="library">▤ Aulas e videoaulas</button>
<button class="nav" data-page="study">▶ Estudar conteúdo</button>
<button class="nav" data-page="calc">∑ Calculadora</button>
<button class="nav" data-page="cases">▧ Casos simulados</button>
<button class="nav" data-page="teacher" id="teacherNav">⚙ Editor do professor</button>
<button class="nav" data-page="progress">▥ Meu progresso</button>
</aside><main class="main" id="main"></main></div>
<div id="login" class="login"><form class="loginBox" id="loginForm"><div class="brand"><div class="logo">✚</div>PharmaClass</div><h1 id="authTitle">Entre para estudar.</h1><p class="muted" id="authSubtitle">Use seu e-mail e sua senha cadastrados.</p><div id="signupNameWrap" class="field hidden"><label for="loginName">Nome para exibição</label><input id="loginName" maxlength="60" autocomplete="name" placeholder="Ex.: Ana Silva"></div><div class="field"><label for="loginEmail">E-mail</label><input id="loginEmail" type="email" required autocomplete="email" placeholder="voce@escola.com"></div><div class="field"><label for="loginPassword">Senha</label><input id="loginPassword" type="password" minlength="8" required autocomplete="current-password" placeholder="Mínimo de 8 caracteres"></div><p id="authMessage" class="small muted" role="status"></p><button id="authSubmit" class="btn" style="width:100%" type="submit">Entrar →</button><button id="authToggle" class="btn line" style="width:100%;margin-top:9px" type="button">Criar conta de aluno</button><button id="forgotPassword" class="btn alt" style="width:100%;margin-top:9px" type="button">Esqueci minha senha</button><div class="notice" style="margin-top:14px">Cada cadastro cria uma conta de aluno. A administração da escola precisa autorizar professores. É necessário configurar o Supabase antes de usar.</div></form></div>
<div id="toast" class="notice hidden" style="position:fixed;bottom:18px;right:18px;z-index:30;max-width:340px;box-shadow:0 8px 30px #1233" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/app.js"></script></body></html>
